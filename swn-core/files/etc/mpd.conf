# CD memory player. Music comes only from the RAM disk.
music_directory         "/run/cdmem"
playlist_directory      "/var/lib/mpd/playlists"
db_file                 "/var/lib/mpd/tag_cache"
sticker_file            "/var/lib/mpd/sticker.sql"
user                    "mpd"
bind_to_address         "localhost"

input {
        plugin "curl"
}

decoder {
        plugin          "hybrid_dsd"
        enabled         "no"
}

decoder {
        plugin          "wildmidi"
        enabled         "no"
}

filesystem_charset      "UTF-8"
include_optional        "mpd_local.conf"

# Keep at 4096. A larger buffer crashed this MPD build, or played the not yet
# written end of track 1 as silence. There is deliberately NO state_file.
audio_buffer_size       "4096"

audio_output {
    type        "alsa"
    name        "AudioDevice"
    device      "hw:CARD=@AUDIO_CARD@,DEV=0"
    mixer_type  "none"
}
